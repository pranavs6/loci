{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">

    {% if error %}
    <div class="govuk-error-summary" data-module="govuk-error-summary">
      <div role="alert">
        <h2 class="govuk-error-summary__title">There is a problem</h2>
        <div class="govuk-error-summary__body">
          <ul class="govuk-list govuk-error-summary__list">
            <li><a href="#username">{{ error }}</a></li>
          </ul>
        </div>
      </div>
    </div>
    {% endif %}

    <h1 class="govuk-heading-l">Sign in</h1>
    <p class="govuk-body">You need an account to control device location.</p>

    <form method="post" action="/login">
      <div class="govuk-form-group">
        <label class="govuk-label" for="username">Username</label>
        <input class="govuk-input govuk-input--width-20" id="username" name="username" type="text"
               autocomplete="username" autocapitalize="none" autocorrect="off" required autofocus>
      </div>
      <div class="govuk-form-group">
        <label class="govuk-label" for="password">Password</label>
        <input class="govuk-input govuk-input--width-20" id="password" name="password" type="password"
               autocomplete="current-password" required>
      </div>
      <button type="submit" class="govuk-button" data-module="govuk-button">Sign in</button>
    </form>

  </div>
</div>
{% endblock %}
