{% extends "base.html" %}
{% block title %}Delete location{% endblock %}
{% block content %}
<a href="/locations" class="govuk-back-link">Back to saved locations</a>

<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">
    <h1 class="govuk-heading-l">Are you sure you want to delete {{ location.name }}?</h1>
    <p class="govuk-body">
      It will be removed from your list. Past activity that refers to it stays readable.
    </p>
    <form method="post" action="/locations/{{ location.id }}/delete">
      <div class="loci-actions">
        <button type="submit" class="govuk-button govuk-button--warning" data-module="govuk-button">Delete location</button>
        <a href="/locations" class="govuk-button govuk-button--secondary" data-module="govuk-button" role="button" draggable="false">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
